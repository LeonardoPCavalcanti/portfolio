<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#30b8ff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="78%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#30b8ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#30b8ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#080808" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Poliedro wireframe (lado direito) -->
  <g transform="translate(860 315) scale(0.95)" stroke="#F0EDE8" stroke-width="1" fill="none" opacity="0.45">
    <polygon points="0,-180 140,-65 100,155 -100,155 -140,-65" />
    <line x1="0" y1="-180" x2="100" y2="155" />
    <line x1="0" y1="-180" x2="-100" y2="155" />
    <line x1="140" y1="-65" x2="-100" y2="155" />
    <line x1="-140" y1="-65" x2="100" y2="155" />
    <line x1="0" y1="-180" x2="0" y2="195" />
    <circle cx="0" cy="-180" r="6" fill="#30b8ff" stroke="none" />
    <circle cx="140" cy="-65" r="4" fill="#30b8ff" stroke="none" opacity="0.7" />
    <circle cx="-140" cy="-65" r="4" fill="#30b8ff" stroke="none" opacity="0.7" />
    <circle cx="100" cy="155" r="4" fill="#30b8ff" stroke="none" opacity="0.5" />
    <circle cx="-100" cy="155" r="4" fill="#30b8ff" stroke="none" opacity="0.5" />
  </g>

  <!-- Texto -->
  <text x="90" y="250" font-family="'Space Mono', monospace" font-size="26" letter-spacing="6" fill="#30b8ff">/ FULL-STACK DEVELOPER</text>
  <text x="86" y="350" font-family="'Syne', 'Arial', sans-serif" font-size="104" font-weight="800" fill="#F0EDE8" letter-spacing="-2">LEONARDO</text>
  <text x="86" y="450" font-family="'Syne', 'Arial', sans-serif" font-size="104" font-weight="800" fill="#F0EDE8" letter-spacing="-2">CAVALCANTI</text>
  <text x="90" y="535" font-family="'Space Mono', monospace" font-size="24" letter-spacing="4" fill="#F0EDE8" fill-opacity="0.4">Code · Architecture · Interactive Design</text>

  <rect x="0" y="618" width="1200" height="12" fill="#30b8ff" />
</svg>
