<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Leonardo Cavalcanti" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Leonardo Cavalcanti — Full-Stack Developer Junior. Engenharia da Computação na UFRN, Natal/RN. React, Node.js, Spring Boot, Django e sistemas distribuídos."
    />
    <meta
      name="keywords"
      content="Leonardo Cavalcanti, Full-Stack Developer, React, TypeScript, Node.js, Spring Boot, Django, UFRN, Natal RN"
    />

    <!-- Open Graph (LinkedIn, WhatsApp, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leonardo Cavalcanti" />
    <meta property="og:title" content="Leonardo Cavalcanti — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Portfólio de Leonardo Cavalcanti — Full-Stack Developer Junior. Código · Arquitetura · Design Interativo."
    />
    <meta property="og:url" content="https://leonardopcavalcanti.github.io/portfolio/" />
    <!-- Raster PNG: social scrapers (LinkedIn, WhatsApp, Discord, X) do not
         render SVG previews, so the shared card needs a real 1200x630 image. -->
    <meta property="og:image" content="https://leonardopcavalcanti.github.io/portfolio/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leonardo Cavalcanti — Full-Stack Developer. Code · Architecture · Interactive Design." />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leonardo Cavalcanti — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfólio de Leonardo Cavalcanti — Full-Stack Developer Junior. Código · Arquitetura · Design Interativo."
    />
    <meta name="twitter:image" content="https://leonardopcavalcanti.github.io/portfolio/og-image.png" />
    <meta name="twitter:image:alt" content="Leonardo Cavalcanti — Full-Stack Developer. Code · Architecture · Interactive Design." />

    <link rel="canonical" href="https://leonardopcavalcanti.github.io/portfolio/" />
    <title>Leonardo Cavalcanti — Full-Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Switzer (display sans) via Fontshare; Instrument Serif (acentos
         editoriais em itálico) + JetBrains Mono (rótulos/refs) via Google. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: lets Google connect this site to the person, so a
         recruiter searching "Leonardo Cavalcanti" can surface the portfolio
         with linked profiles. Static in <head> so crawlers see it without JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Leonardo Cavalcanti",
        "alternateName": "Leonardo Pereira Cavalcanti",
        "url": "https://leonardopcavalcanti.github.io/portfolio/",
        "image": "https://leonardopcavalcanti.github.io/portfolio/og-image.png",
        "jobTitle": "Full-Stack Developer",
        "email": "mailto:leopcavalcanti30@gmail.com",
        "description": "Full-Stack Developer Junior — React, Node.js, Spring Boot, Django e sistemas distribuídos.",
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "Spring Boot",
          "Django",
          "Distributed Systems",
          "PostgreSQL"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Universidade Federal do Rio Grande do Norte",
          "sameAs": "https://www.ufrn.br/"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Natal",
          "addressRegion": "RN",
          "addressCountry": "BR"
        },
        "sameAs": [
          "https://github.com/LeonardoPCavalcanti",
          "https://linkedin.com/in/leonardocavalcanti-dev"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
